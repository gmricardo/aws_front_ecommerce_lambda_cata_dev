name: Build and Deploy to S3 (Integration)

on:
  push:
    branches:
      - integration

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: AWS_Config_Ricardo

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Install AWS CLI v2
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update


      - name: Sync dist to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -e

          # Sync assets
          aws s3 sync dist/ s3://$S3_BUCKET --delete --cache-control "max-age=31536000,public"

          # Upload index.html with no cache
          HTML_FILE="dist/index.html"
          TARGET="s3://$S3_BUCKET/index.html"

          if [ -f "$HTML_FILE" ]; then
            echo "Uploading index.html with no-cache headers..."
            aws s3 cp "$HTML_FILE" "$TARGET" --cache-control "no-cache, no-store, must-revalidate"
          else
            echo "No index.html found, skipping."
          fi

